<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CotaStack — Redirection vers l'application</title>
  
  <!-- Redirection immédiate par balise meta -->
  <meta http-equiv="refresh" content="0; url=https://cotastack.streamlit.app/">
  <link rel="canonical" href="https://cotastack.streamlit.app/">

  <!-- Redirection immédiate par JavaScript -->
  <script>
    window.location.replace("https://cotastack.streamlit.app/");
  </script>

  <!-- Tailwind CSS pour un affichage de transition élégant -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 flex items-center justify-center min-h-screen p-4 font-sans antialiased">

  <div class="max-w-md w-full bg-white rounded-2xl border border-slate-200 shadow-xl p-8 text-center">
    <div class="w-16 h-16 rounded-2xl bg-sky-600 text-white flex items-center justify-center text-3xl mx-auto mb-5 shadow-sm">
      📐
    </div>

    <h1 class="text-2xl font-bold text-slate-900 mb-2">CotaStack</h1>
    <p class="text-slate-600 text-sm mb-6">
      Ouverture en cours du calculateur de chaînes de cotes 1D...
    </p>

    <!-- Animation de chargement -->
    <div class="flex justify-center items-center gap-1.5 mb-8">
      <span class="w-2.5 h-2.5 rounded-full bg-sky-600 animate-bounce" style="animation-delay: 0s;"></span>
      <span class="w-2.5 h-2.5 rounded-full bg-sky-600 animate-bounce" style="animation-delay: 0.15s;"></span>
      <span class="w-2.5 h-2.5 rounded-full bg-sky-600 animate-bounce" style="animation-delay: 0.3s;"></span>
    </div>

    <a href="https://cotastack.streamlit.app/" 
       class="inline-flex items-center justify-center w-full py-3 px-6 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-semibold text-sm transition shadow-sm gap-2">
      <span>Ouvrir l'application maintenant</span>
      <span>&rarr;</span>
    </a>

    <p class="text-xs text-slate-400 mt-5">
      Si la redirection automatique ne s'effectue pas, cliquez sur le bouton ci-dessus.
    </p>
  </div>

</body>
</html>
